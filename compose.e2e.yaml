# 隔离栈端到端验收编排：五个服务以 docker/Dockerfile 在容器内编译并运行，
# 与 make test-integration 共用 compose.test.yaml 的 3307 测试三库与 6381 Redis。
# 经 `make e2e` 启动（内部以 -f compose.test.yaml -f compose.e2e.yaml 合并，
# 项目沿用 chargepilot-refactor-tests，服务 DNS 即 mysql／redis）。
# central 8082 与生产编排一致不映射宿主机端口，仅容器网络可达。
name: chargepilot-refactor-tests

x-go-build: &go-build
  context: .
  dockerfile: docker/Dockerfile

# 隔离栈专用测试凭据，与 compose.test.yaml 的公开测试值同层级，不得用于生产。
x-e2e-env: &e2e-env
  SERVICE_TOKEN: e2e-internal-service-token-0123456789abcdef
  JWT_SECRET: e2e-jwt-secret-0123456789abcdef0123456789abcdef
  WECHAT_APPID: e2e-appid
  PAYMENT_MODE: simulation

services:
  migrate:
    build:
      <<: *go-build
      args: { SERVICE: migrate }
    command: ["--schema", "all"]
    restart: "no"
    environment:
      DATABASE_URL_GATEWAY: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      DATABASE_URL_WORKER: mysql://chargepilot:chargepilot_dev@mysql:3306/worker_db
    depends_on:
      mysql: { condition: service_healthy }

  central:
    build:
      <<: *go-build
      args: { SERVICE: central }
    restart: "no"
    environment:
      <<: *e2e-env
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      REDIS_CACHE_URL: redis://redis:6379/0
      GATEWAY_INTERNAL_URL: http://gateway:8083
    expose: ["8082"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  gateway:
    build:
      <<: *go-build
      args: { SERVICE: gateway }
    restart: "no"
    environment:
      <<: *e2e-env
      DATABASE_URL: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      DC589_ADDR: :9100
      CENTRAL_INTERNAL_URL: http://central:8082
    ports: ["127.0.0.1:8083:8083", "127.0.0.1:9100:9100"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  user:
    build:
      <<: *go-build
      args: { SERVICE: user }
    restart: "no"
    environment:
      <<: *e2e-env
      WECHAT_SECRET: e2e-app-secret
      LOGIN_MODE: development
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      REDIS_CACHE_URL: redis://redis:6379/0
      GATEWAY_INTERNAL_URL: http://gateway:8083
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  admin:
    build:
      <<: *go-build
      args: { SERVICE: admin }
    restart: "no"
    environment:
      <<: *e2e-env
      ADMIN_BOOTSTRAP_USER: admin
      ADMIN_BOOTSTRAP_PASSWORD: ChangeMe!Admin2026
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      REDIS_CACHE_URL: redis://redis:6379/0
      GATEWAY_INTERNAL_URL: http://gateway:8083
      EXPORT_DIR: /var/lib/chargepilot/exports
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build:
      <<: *go-build
      args: { SERVICE: worker }
    restart: "no"
    environment:
      <<: *e2e-env
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      DATABASE_URL_WORKER: mysql://chargepilot:chargepilot_dev@mysql:3306/worker_db
      DATABASE_URL_GATEWAY: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      REDIS_STREAM_URL: redis://redis:6379/1
      CENTRAL_INTERNAL_URL: http://central:8082
      GATEWAY_INTERNAL_URL: http://gateway:8083
    ports: ["127.0.0.1:8085:8085"]
    depends_on:
      migrate: { condition: service_completed_successfully }

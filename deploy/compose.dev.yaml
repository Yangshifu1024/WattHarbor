# 本地开发栈：单体 Go 应用在 /workspace/backend 编译并运行。
# 宿主机相对路径以 deploy/ 为起点，.. 表示仓库根。
# 启动保留数据；重建数据库使用 scripts/db/reset-dev.mjs。
name: wattharbor-dev

x-go: &go
  image: golang:1.27
  working_dir: /workspace/backend
  init: true
  volumes:
    - ..:/workspace
    - go-modules:/go/pkg/mod
    - go-build:/root/.cache/go-build
  environment: &go-env
    TZ: Asia/Shanghai
    DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
    DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
    DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
    DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    GOTOOLCHAIN: auto
    # 使用 goproxy.cn 下载 Go 依赖；可按开发环境调整代理。
    GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: wattharbor_root_dev
      MYSQL_ROOT_HOST: localhost
      MYSQL_USER: wattharbor
      MYSQL_PASSWORD: wattharbor_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-socket:/var/run/mysqld
      - ./mysql/init-databases.sql:/docker-entrypoint-initdb.d/10-wattharbor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u wattharbor -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-stream:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-stream-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.27
    working_dir: /workspace/backend
    command: ["go", "run", "./cmd/migrate", "--schema", "all"]
    volumes:
      - ..:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
      DATABASE_URL_GATEWAY: mysql://wattharbor:wattharbor_dev@mysql:3306/gateway_db
      DATABASE_URL_CENTRAL: mysql://wattharbor:wattharbor_dev@mysql:3306/central_db
      DATABASE_URL_WORKER: mysql://wattharbor:wattharbor_dev@mysql:3306/worker_db
    depends_on:
      mysql: { condition: service_healthy }

  provision-runtime:
    build:
      context: ./mysql
      dockerfile: runtime-accounts.Dockerfile
    command: ["--three-schema"]
    restart: "no"
    network_mode: none
    volumes:
      - ../scripts/db/provision-runtime.mjs:/provision-runtime.mjs:ro
      - mysql-socket:/var/run/mysqld:ro
    environment:
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_ROOT_PASSWORD: wattharbor_root_dev
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wattharbor_app_dev}
    depends_on:
      migrate: { condition: service_completed_successfully }

  app:
    <<: *go
    command: ["sh", "-ec", "go build -o /tmp/wattharbor ./cmd/wattharbor && exec /tmp/wattharbor"]
    volumes:
      - ..:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - export-files:/var/lib/wattharbor/exports
    environment:
      <<: *go-env
      APP_UNIFIED_DATABASE: "false"
      DATABASE_URL: &gateway-dsn mysql://wattharbor_app:${DB_APP_PASSWORD:-wattharbor_app_dev}@mysql:3306/gateway_db
      DATABASE_URL_GATEWAY: *gateway-dsn
      DATABASE_URL_CENTRAL: mysql://wattharbor_app:${DB_APP_PASSWORD:-wattharbor_app_dev}@mysql:3306/central_db
      DATABASE_URL_WORKER: mysql://wattharbor_app:${DB_APP_PASSWORD:-wattharbor_app_dev}@mysql:3306/worker_db
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      REDIS_STREAM_URL: redis://redis-stream:6379/0
      JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
      SERVICE_TOKEN: local-dev-service-token-do-not-use-in-production
      WECHAT_APPID: wx_local_dev
      WECHAT_SECRET: local-dev-placeholder
      PAYMENT_MODE: simulation
      LOGIN_MODE: development
      GATEWAY_DEBUG_HEARTBEAT: true
      EXPORT_DIR: /var/lib/wattharbor/exports
      # 开发后台由宿主机直连，不默认信任 Vite 或其他来源的转发头。
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe!Admin2026}
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
      redis-stream: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 45s
    stop_grace_period: 20s
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9100:9100"]

  admin-web:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/frontend/admin-web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      DEV_API_PROXY_TARGET: http://app:8080
      DEV_USE_POLLING: "true"
      VITE_API_BASE: ""
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ../frontend/admin-web:/workspace/frontend/admin-web
      - node-modules:/workspace/frontend/admin-web/node_modules
      - npm-cache:/root/.npm
    depends_on:
      app: { condition: service_healthy }

  user-h5:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/frontend/miniprogram
    command: ["sh", "-c", "npm ci --legacy-peer-deps --no-audit --no-fund && exec npm run dev:h5"]
    environment:
      DEV_API_PROXY_TARGET: http://app:8080
      TARO_APP_API_BASE: /api/v1
      TARO_APP_LOGIN_MODE: development
    ports: ["127.0.0.1:5174:5174"]
    volumes:
      - ../frontend/miniprogram:/workspace/frontend/miniprogram
      - user-node-modules:/workspace/frontend/miniprogram/node_modules
      - npm-cache:/root/.npm
    depends_on:
      app: { condition: service_healthy }

volumes:
  mysql-data:
  mysql-socket:
  redis-stream-data:
  go-modules:
  go-build:
  node-modules:
  npm-cache:
  export-files:
  user-node-modules:

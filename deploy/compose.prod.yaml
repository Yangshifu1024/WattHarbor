# 生产单体部署。环境变量由仓库根目录的 .env 提供。
name: wattharbor-monolith

x-app-build: &app-build
  image: wattharbor:monolith
  build:
    context: ..
    dockerfile: deploy/Dockerfile.monolith

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_HOST: localhost
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: wattharbor
      MYSQL_USER: wattharbor
      MYSQL_PASSWORD: ${DB_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u wattharbor -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - monolith-mysql:/var/lib/mysql
      - mysql-socket:/var/run/mysqld
    restart: unless-stopped

  cache:
    image: redis:8-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck: &redis-health
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  stream:
    image: redis:8-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_STREAM_PASSWORD:?required}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_STREAM_PASSWORD:?required}"]
    healthcheck: *redis-health
    volumes:
      - monolith-stream:/data
    restart: unless-stopped

  migrate:
    <<: *app-build
    command: ["/usr/local/bin/migrate", "-schema", "unified"]
    environment:
      DATABASE_URL: mysql://wattharbor:${DB_PASSWORD:?required}@mysql:3306/wattharbor
    depends_on:
      mysql: { condition: service_healthy }

  provision-runtime:
    build:
      context: ./mysql
      dockerfile: runtime-accounts.Dockerfile
    command: ["--unified"]
    network_mode: none
    environment:
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?required}
    volumes:
      - ../scripts/db/provision-runtime.mjs:/provision-runtime.mjs:ro
      - mysql-socket:/var/run/mysqld:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  app:
    <<: *app-build
    environment:
      APP_UNIFIED_DATABASE: "true"
      DATABASE_URL: &dsn mysql://wattharbor_app:${DB_APP_PASSWORD:?required}@mysql:3306/wattharbor
      DATABASE_URL_CENTRAL: *dsn
      DATABASE_URL_GATEWAY: *dsn
      DATABASE_URL_WORKER: *dsn
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:?required}@cache:6379/0
      REDIS_STREAM_URL: redis://:${REDIS_STREAM_PASSWORD:?required}@stream:6379/0
      JWT_SECRET: ${JWT_SECRET:?required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
      WECHAT_APPID: ${WECHAT_APPID:?required}
      WECHAT_SECRET: ${WECHAT_SECRET:?required}
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      LOGIN_MODE: ${LOGIN_MODE:-wechat}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_CERT_SERIAL: ${WECHAT_CERT_SERIAL:-}
      WECHAT_APIV3_KEY: ${WECHAT_APIV3_KEY:-}
      WECHAT_PRIVATE_KEY_PATH: ${WECHAT_PRIVATE_KEY_PATH:-}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-}
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      EXPORT_DIR: /var/lib/wattharbor/exports
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      ADMIN_TRUSTED_PROXIES: ${CADDY_ADMIN_PROXY_IP:-172.30.82.2}
    networks: [default, edge]
    expose: ["8080"]
    ports: ["9100:9100"]
    volumes:
      - monolith-exports:/var/lib/wattharbor/exports
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      cache: { condition: service_healthy }
      stream: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - monolith-caddy:/data
    networks:
      public: {}
      edge:
        ipv4_address: ${CADDY_ADMIN_PROXY_IP:-172.30.82.2}
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

networks:
  public:
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${ADMIN_PROXY_SUBNET:-172.30.82.0/24}

volumes:
  monolith-mysql:
  mysql-socket:
  monolith-stream:
  monolith-exports:
  monolith-caddy:

# 本地 Go 开发栈。Go 模块位于 backend/，go 服务容器在 /workspace/backend 运行。
# 本文件位于 docker/，该目录即 Compose 项目目录：文件内宿主机相对路径相对 docker/
# 解析，`..` 指仓库根。保留现有数据；结构重建使用 scripts/db/reset-dev.mjs。
name: chargepilot-dev

x-go: &go
  image: golang:1.27
  working_dir: /workspace/backend
  init: true
  volumes:
    - ..:/workspace
    - go-modules:/go/pkg/mod
    - go-build:/root/.cache/go-build
  environment: &go-env
    TZ: Asia/Shanghai
    DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
    DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
    DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
    DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    GOTOOLCHAIN: auto
    # 在中国大陆访问不到 proxy.golang.org，能用的是 goproxy.cn 这个镜像。
    # 等团队统一到可达的代理后删掉这段。
    GOPROXY: https://goproxy.cn,direct
    SERVICE_TOKEN: local-dev-service-token-do-not-use-in-production
  depends_on:
    provision-runtime: { condition: service_completed_successfully }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: chargepilot_root_dev
      MYSQL_ROOT_HOST: localhost
      MYSQL_USER: chargepilot
      MYSQL_PASSWORD: chargepilot_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-socket:/var/run/mysqld
      - ./mysql/init-databases.sql:/docker-entrypoint-initdb.d/10-chargepilot.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u chargepilot -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-stream:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-stream-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.27
    working_dir: /workspace/backend
    command: ["go", "run", "./cmd/migrate", "--schema", "all"]
    volumes:
      - ..:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      GOPROXY: https://goproxy.cn,direct
      DATABASE_URL_GATEWAY: mysql://chargepilot:chargepilot_dev@mysql:3306/gateway_db
      DATABASE_URL_CENTRAL: mysql://chargepilot:chargepilot_dev@mysql:3306/central_db
      DATABASE_URL_WORKER: mysql://chargepilot:chargepilot_dev@mysql:3306/worker_db
    depends_on:
      mysql: { condition: service_healthy }

  provision-runtime:
    build:
      context: ./mysql
      dockerfile: runtime-accounts.Dockerfile
    restart: "no"
    network_mode: none
    volumes:
      - ../scripts/db/provision-runtime.mjs:/provision-runtime.mjs:ro
      - mysql-socket:/var/run/mysqld:ro
    environment:
      MYSQL_SOCKET: /var/run/mysqld/mysqld.sock
      MYSQL_ROOT_PASSWORD: chargepilot_root_dev
      DB_USER_PASSWORD: ${DB_USER_PASSWORD:-chargepilot_user_dev}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-chargepilot_admin_dev}
      DB_CENTRAL_PASSWORD: ${DB_CENTRAL_PASSWORD:-chargepilot_central_dev}
      DB_GATEWAY_PASSWORD: ${DB_GATEWAY_PASSWORD:-chargepilot_gateway_dev}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:-chargepilot_worker_dev}
    depends_on:
      migrate: { condition: service_completed_successfully }

  gateway:
    <<: *go
    command: ["go", "run", "./cmd/gateway"]
    environment:
      <<: *go-env
      DATABASE_URL: mysql://chargepilot_gateway:${DB_GATEWAY_PASSWORD:-chargepilot_gateway_dev}@mysql:3306/gateway_db
      GATEWAY_DEBUG_HEARTBEAT: true
    ports: ["127.0.0.1:8083:8083", "127.0.0.1:9100:9100"]

  # C 端。与运营后台、后台服务分属不同进程，对外只暴露 8080。
  user:
    <<: *go
    command: ["go", "run", "./cmd/user"]
    environment:
      <<: *go-env
      JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
      WECHAT_APPID: wx_local_dev
      WECHAT_SECRET: local-dev-placeholder
      PAYMENT_MODE: simulation
      LOGIN_MODE: development
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      DATABASE_URL_CENTRAL: mysql://chargepilot_user:${DB_USER_PASSWORD:-chargepilot_user_dev}@mysql:3306/central_db
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]

  # 对内服务间接口。不映射端口：开发栈与生产保持同一隔离策略，
  # 内部端口只在 compose 网络内可达，从宿主机打不开。
  central:
    <<: *go
    command: ["go", "run", "./cmd/central"]
    environment:
      <<: *go-env
      WECHAT_APPID: wx_local_dev
      PAYMENT_MODE: simulation
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      DATABASE_URL_CENTRAL: mysql://chargepilot_central:${DB_CENTRAL_PASSWORD:-chargepilot_central_dev}@mysql:3306/central_db
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }

  # 运营后台。只暴露 /api/v1/admin/*，与 C 端走不同的进程与端口。
  admin:
    <<: *go
    command: ["go", "run", "./cmd/admin"]
    volumes:
      - ..:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - export-files:/var/lib/chargepilot/exports
    environment:
      <<: *go-env
      JWT_SECRET: local-dev-jwt-secret-do-not-use-in-production
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      DATABASE_URL_CENTRAL: mysql://chargepilot_admin:${DB_ADMIN_PASSWORD:-chargepilot_admin_dev}@mysql:3306/central_db
      EXPORT_DIR: /var/lib/chargepilot/exports
      ADMIN_BOOTSTRAP_USER: ${ADMIN_BOOTSTRAP_USER:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe!Admin2026}
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8081"]

  worker:
    <<: *go
    command: ["go", "run", "./cmd/worker"]
    environment:
      <<: *go-env
      REDIS_STREAM_URL: redis://redis-stream:6379/0
      DATABASE_URL_WORKER: mysql://chargepilot_worker:${DB_WORKER_PASSWORD:-chargepilot_worker_dev}@mysql:3306/worker_db
      DATABASE_URL_GATEWAY: mysql://chargepilot_worker:${DB_WORKER_PASSWORD:-chargepilot_worker_dev}@mysql:3306/gateway_db
      DATABASE_URL_CENTRAL: mysql://chargepilot_worker:${DB_WORKER_PASSWORD:-chargepilot_worker_dev}@mysql:3306/central_db
      REGULATORY_MODE: simulation
    depends_on:
      provision-runtime: { condition: service_completed_successfully }
      redis-stream: { condition: service_healthy }
    ports: ["127.0.0.1:8085:8085"]

  admin-web:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/admin-web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    environment:
      DEV_API_PROXY_TARGET: http://admin:8081
      DEV_USE_POLLING: "true"
      VITE_API_BASE: ""
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ../admin-web:/workspace/admin-web
      - node-modules:/workspace/admin-web/node_modules
      - npm-cache:/root/.npm
    depends_on:
      admin: { condition: service_started }

  user-h5:
    image: node:24-bookworm-slim
    init: true
    working_dir: /workspace/miniprogram
    command: ["sh", "-c", "npm ci --legacy-peer-deps --no-audit --no-fund && exec npm run dev:h5"]
    environment:
      DEV_API_PROXY_TARGET: http://user:8080
      TARO_APP_API_BASE: /api/v1
      TARO_APP_LOGIN_MODE: development
    ports: ["127.0.0.1:5174:5174"]
    volumes:
      - ../miniprogram:/workspace/miniprogram
      - user-node-modules:/workspace/miniprogram/node_modules
      - npm-cache:/root/.npm
    depends_on:
      central: { condition: service_started }

volumes:
  mysql-data:
  mysql-socket:
  redis-stream-data:
  go-modules:
  go-build:
  node-modules:
  npm-cache:
  export-files:
  user-node-modules:

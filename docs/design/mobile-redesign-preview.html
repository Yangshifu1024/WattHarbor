<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>电港充电 · 移动端设计样稿</title>
<style>
:root{color-scheme:light;--ink:#13191c;--muted:#526068;--line:#dbe1e3;--silver:#f4f6f6;--ice:#c3f1fb;--deep:#13566a;--column:970px}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:transparent}button:disabled{cursor:default}button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #157189;outline-offset:3px}h1,h2,h3,p,figure{margin:0}h1,h2,h3{line-height:1.2;letter-spacing:-.045em}h1{font-size:clamp(25px,3vw,35px)}h2{font-size:22px}h3{font-size:17px}small,.muted{color:var(--muted);font-size:14px}[hidden]{display:none!important}.wrap{width:min(100%,var(--column));margin:auto;padding:0 28px}
.brand,.row,.spread,.site,.unit,.meta,.nav,.nav button,.entry,.accountHead,.tool,.headback{display:flex;align-items:center}.spread,.site,.unit{justify-content:space-between}.top{border-bottom:1px solid var(--line)}.top .wrap{height:68px}.brand{gap:10px}.mark{width:32px;height:29px;display:inline-flex;align-items:center;gap:3px;transform:skewX(-21deg);justify-content:center}.mark i{height:17px;width:6px;background:var(--ink)}.mark i:first-child{height:12px;align-self:flex-start;margin-top:5px}.mark i:last-child{height:21px;align-self:flex-end;margin-bottom:2px;background:#50717c}.word{font-size:21px;letter-spacing:-.05em;font-weight:790}.english{margin-left:7px;font:650 12px/1.1 Arial,sans-serif;letter-spacing:-.03em;color:#626c70}.demo{font-size:12px;color:#626c70}.headback{gap:6px;min-height:44px;padding:0 6px 0 0}.stage{padding-top:20px;padding-bottom:calc(105px + env(safe-area-inset-bottom));min-height:72vh}.advert{position:relative;isolation:isolate;display:flex;align-items:center;overflow:hidden;border-radius:14px;background:#101418;color:white;min-height:135px;height:clamp(145px,21vw,208px);margin-bottom:28px}.advert img{inset:0;position:absolute;width:100%;height:100%;object-fit:cover;object-position:62% 45%;z-index:-2}.advert:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0d12a8,transparent 66%);z-index:-1}.advert div{margin-left:clamp(18px,4vw,48px)}.advert strong{font-size:clamp(26px,4.3vw,44px);line-height:1.16;letter-spacing:-.055em;display:block}.advert small{display:block;color:#cad1d4;font-size:13px;margin-top:7px}.adtag{position:absolute;top:10px;right:12px;font-size:10px;line-height:1.45;color:#fff;border:1px solid #ffffff80;border-radius:3px;padding:0 4px;background:#13191c80}.inner .advert{height:clamp(110px,14vw,145px);min-height:0;margin-bottom:20px}.inner .advert strong{font-size:clamp(21px,3vw,31px)}
.heading{margin:0 0 14px;gap:14px}.list{border-top:1px solid var(--line)}.site,.unit{width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;gap:14px}.site:hover,.unit:hover,.tool:hover{background:var(--silver)}.photo{flex:0 0 90px;aspect-ratio:1.36;border-radius:7px;background-image:url('mobile-redesign-station-photos.jpg');background-repeat:no-repeat;background-size:300% 100%}.copy{flex:1;min-width:0}.copy strong{display:block;font-size:18px;letter-spacing:-.035em}.copy small{display:block;margin-top:4px}.nums{text-align:right;flex:none}.nums b{font-size:23px;line-height:1.05;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.nums small{display:block;font-size:12px}.chev{width:8px;height:8px;border-top:1.5px solid #717e83;border-right:1.5px solid #717e83;transform:rotate(45deg);flex:none;margin-right:3px}.meta{flex-wrap:wrap;gap:10px;color:var(--muted);font-size:14px;margin:5px 0 18px}.stationHead{margin-bottom:22px}.devIcon{height:52px;width:44px;flex:none;background:linear-gradient(135deg,#f9fbfb,#d6dddf);border:1px solid #aeb9be;border-radius:7px;display:grid;place-content:center;box-shadow:inset 2px 0 2px white;color:#405057}.devIcon:before{content:"";height:11px;width:20px;background:#3f5058;border-radius:2px;border-bottom:3px solid #aadae5}.serial{font:12px/1.4 ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted)}.unit .copy strong{font-size:18px}.area{margin-top:24px}.ports,.offers,.services{display:grid;gap:8px}.ports{grid-template-columns:repeat(6,minmax(0,1fr));margin:12px 0 0}.port,.offer{min-height:65px;border:1px solid #c7d0d4;border-radius:8px;background:white;padding:8px;color:var(--ink);position:relative}.port b,.port small,.offer b,.offer small{display:block}.port b{font:620 23px/1.18 ui-monospace,monospace}.port small{font-size:12px}.port:disabled{background:#f2f4f4;border-color:transparent}.port[aria-pressed=true],.offer[aria-pressed=true]{border-color:#2a505d;box-shadow:inset 0 0 0 1px #2a505d;background:#ecf8fb}.port[aria-pressed=true]:after,.offer[aria-pressed=true]:after{content:"✓";color:var(--deep);position:absolute;right:6px;top:3px;font-size:12px}.mode{display:flex;gap:4px;margin:12px 0 8px;border-bottom:1px solid var(--line)}.mode button{min-height:44px;font-size:14px;color:var(--muted);padding:0 12px}.mode [aria-pressed=true]{border-bottom:2px solid var(--ink);color:var(--ink);font-weight:670}.offers{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}.offer b{font-size:20px}.offer small{font-size:12px}.hint{font-size:13px;color:var(--muted);margin:9px 0}.primary,.secondary{padding:10px 18px;min-height:46px;font-weight:650;border-radius:9px}.primary{background:var(--ink);color:white}.primary:disabled{background:#e2e7e8;color:#58646b}.secondary{background:var(--silver);border:1px solid var(--line)}.full{width:100%}.navWrap{position:fixed;inset:auto 0 0;background:#fffffff5;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:3}.nav{max-width:520px;height:71px;margin:auto;justify-content:space-around}.nav button{width:32%;height:100%;justify-content:center;flex-direction:column;gap:3px;color:#616c71;font-size:12px}.nav button[aria-current=page]{color:var(--ink);font-weight:750}.nav button[aria-current=page] .icon{background:var(--ice);border-radius:14px}.icon{height:27px;width:42px;display:grid;place-items:center}.nav .scanIcon{color:white;background:var(--ink);height:33px;width:46px;border-radius:12px}.glyph{width:20px;height:20px;display:block;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.accountHead{gap:13px;padding:10px 0 20px}.avatar{width:48px;height:48px;border-radius:50%;background:#e8eff1;display:grid;place-items:center}.wallet{background:linear-gradient(120deg,#151b1e,#344046);color:white;border-radius:14px;padding:22px 24px;margin-bottom:24px}.wallet small{color:#d6e0e4}.balance{font:600 40px/1.25 Arial,sans-serif;margin:8px 0;letter-spacing:-.045em}.wallet button{color:white;min-height:44px;text-decoration:underline}.services{grid-template-columns:repeat(2,1fr);gap:0 20px}.tool{width:100%;gap:12px;min-height:56px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left}.tool .chev{margin-left:auto}.orderRow{width:100%;border-block:1px solid var(--line);padding:13px 0;text-align:left}.orderRow strong{display:block}.orderRow button{color:var(--deep)}.link{color:var(--deep);min-height:44px;font-size:14px;font-weight:600}.row{gap:10px}dialog{width:min(390px,calc(100% - 28px));border:1px solid var(--line);border-radius:16px;padding:21px;background:white;color:var(--ink)}dialog::backdrop{background:#10181c88}dialog h2{margin-bottom:10px}dialog p{font-size:15px;color:var(--muted);margin:8px 0}dialog input{width:100%;padding:12px;border:1px solid #86949b;border-radius:8px;margin:8px 0}dialog button{margin-top:6px}.error{color:#923718}dialog .secondary{margin-left:0}#back{display:none}.hbtn{background:none;border:0;padding:0}.thin{font-size:13px;color:var(--muted)}
@media(max-width:650px){.wrap{padding:0 17px}.stage{padding-top:14px;padding-bottom:calc(94px + env(safe-area-inset-bottom))}.top .wrap{height:54px}.word{font-size:20px}.english{font-size:11px}.advert{height:151px;border-radius:11px;margin-bottom:22px}.inner .advert{height:105px;margin-bottom:18px}.inner .advert small{margin-top:2px}.site,.unit{gap:10px;padding:13px 0}.photo{flex-basis:70px;aspect-ratio:1.1}.copy strong,.unit .copy strong{font-size:16px}.copy small{font-size:13px}.nums b{font-size:20px}.ports{grid-template-columns:repeat(3,minmax(0,1fr))}.services{grid-template-columns:1fr}.heading{margin-bottom:11px}.area{margin-top:18px}.wallet{padding:18px}.port{min-height:58px}.nav{height:64px}.inner .heading h1{font-size:24px}.devicehead .meta{margin-bottom:10px}.brand .english{margin-left:2px}}
</style></head><body>
<header class="top"><div class="wrap spread"><button class="headback hbtn" id="back" type="button">‹ 返回</button><div class="brand" id="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="word">电港充电</span><span class="english">WattHarbor</span></div><small class="demo">交互样稿</small></div></header>
<main class="wrap stage" id="main"></main>
<div class="navWrap"><nav class="nav" aria-label="底部导航"><button id="homeNav"><span class="icon" data-icon="home"></span>首页</button><button id="scanNav"><span class="icon scanIcon" data-icon="scan"></span>扫码</button><button id="meNav"><span class="icon" data-icon="user"></span>我的</button></nav></div>
<dialog id="sheet" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="secondary full" id="close">关闭</button></dialog>
<script>
const el=id=>document.getElementById(id);
const paths={home:'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z',scan:'M3 9V4h5m8 0h5v5M3 15v5h5m13-5v5h-5M5 12h14',user:'M16.2 8a4.2 4.2 0 1 1-8.4 0 4.2 4.2 0 1 1 8.4 0M4 21a8 8 0 0 1 16 0',card:'M3 5h18v14H3zM3 10h18',list:'M5 4h14v16H5zM8 9h8m-8 5h6',arrow:'M5 12h14m-6-6 6 6-6 6',bill:'M5 3h14v18l-4-2-3 2-3-2-4 2zM8 8h8m-8 4h6'};
function icon(name){return '<svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[name]+'"></path></svg>';}
document.querySelectorAll('[data-icon]').forEach(node=>node.innerHTML=icon(node.dataset.icon));
const stations=[
 {name:'北苑车棚充电站',address:'北苑社区 · 北门自行车停车区',photo:'0%',devices:[['北门 01 号设备','5348240514082652','iuiufi'],['北门 02 号设备','5348240514082653','iiuuui']]},
 {name:'西门充电站',address:'创智园区 · 西门办公楼旁',photo:'50%',devices:[['西门 01 号设备','5348240514082654','uiiiuu'],['西门 02 号设备','5348240514082655','oooooo']]},
 {name:'东区停车棚',address:'东区公寓 · 3 号楼架空层',photo:'100%',devices:[['东区 01 号设备','5348240514082656','iiuiuf']]}];
const modes={amount:{name:'按金额',offers:[['预付 2 元',200],['预付 5 元',500],['预付 10 元',1000]],rule:'按实际消费结算，剩余款项按订单规则退款。'},duration:{name:'按时长',offers:[['2 小时',200],['4 小时',400]],rule:'按设备确认的实际充电时长及套餐规则结算。'},energy:{name:'按电量',offers:[['1 度电',200],['2 度电',400]],rule:'按实测电量及本次套餐规则结算。'}};
const states={i:'空闲',u:'使用中',f:'故障',o:'离线'};
let route={page:'home'},selection={},order=null;
const money=c=>'¥'+(c/100).toFixed(2);
const idle=s=>Array.from(s).filter(c=>c==='i').length;
function nav(page,s=0,d=0){const hash=page==='station'?'station/'+s:page==='device'?'device/'+s+'/'+d:page;if(location.hash.slice(1)===hash){draw();return;}location.hash=hash;}
function readRoute(){
 const [page,s,d]=location.hash.slice(1).split('/');
 if(page==='me')return {page};
 if((page==='station'||page==='device')&&/^\d+$/.test(s)&&stations[+s]&&(page==='station'||(/^\d+$/.test(d)&&stations[+s].devices[+d])))return {page,s:+s,d:+d||0};
 return {page:'home'};
}
function advert(){return '<aside class="advert" aria-label="示例广告"><img src="mobile-redesign-metal-banner.jpg" alt=""><span class="adtag">广告</span><div><strong>为城市骑行充电</strong><small>电港两轮车充电服务</small></div></aside>';}
const chevron='<span class="chev" aria-hidden="true"></span>';
function homeView(){return advert()+'<div class="spread heading"><h1>充电站</h1><small>共 '+stations.length+' 个站点</small></div><div class="list">'+stations.map((s,i)=>'<button class="site" data-station="'+i+'"><span class="photo" style="background-position:'+s.photo+' center"></span><span class="copy"><strong>'+s.name+'</strong><small>'+s.address+'</small></span><span class="nums"><b>'+idle(s.devices.map(d=>d[2]).join(''))+'</b><small>空闲端口</small></span>'+chevron+'</button>').join('')+'</div>';}
function stationView(s){return advert()+'<div class="stationHead"><h1>'+s.name+'</h1><p class="meta">'+s.address+'</p></div><div class="spread heading"><h2>设备列表</h2><small>'+s.devices.length+' 台设备</small></div><div class="list">'+s.devices.map(([name,id,ports],i)=>'<button class="unit" data-device="'+i+'"><span class="devIcon" aria-hidden="true"></span><span class="copy"><strong>'+name+'</strong><small class="serial">'+id+'</small></span><span class="nums"><b>'+idle(ports)+' / '+ports.length+'</b><small>'+(ports.includes('o')?'设备离线':'空闲 / 总端口')+'</small></span>'+chevron+'</button>').join('')+'</div>';}
function deviceView(s,d){
 const {port,mode,offer}=selection;const tarif=modes[mode];
 return advert()+'<div class="devicehead"><h1>'+d[0]+'</h1><p class="meta">'+s.name+' <span class="serial">'+d[1]+'</span></p></div><section class="area"><div class="spread"><h2>选择端口</h2><small>空闲 '+idle(d[2])+' / '+d[2].length+'</small></div><div class="ports">'+Array.from(d[2],(c,i)=>'<button class="port" data-port="'+i+'" aria-pressed="'+(port===i)+'" '+(c==='i'?'':'disabled')+'><b>'+String(i+1).padStart(2,'0')+'</b><small>'+states[c]+'</small></button>').join('')+'</div></section><section class="area"><h2>充电套餐</h2><div class="mode">'+Object.entries(modes).map(([k,v])=>'<button data-mode="'+k+'" aria-pressed="'+(k===mode)+'">'+v.name+'</button>').join('')+'</div><div class="offers">'+tarif.offers.map(([label,price],i)=>'<button class="offer" data-offer="'+i+'" aria-pressed="'+(offer===i)+'" '+(port===null?'disabled':'')+'><b>'+money(price)+'</b><small>'+label+'</small></button>').join('')+'</div><p class="hint">'+(port===null?'请先选择一个空闲端口。':tarif.rule)+'</p><button class="primary full" data-pay '+(!order&&(port===null||offer===null)?'disabled':'')+'>'+(order?'查看当前订单':port===null?'请选择端口':offer===null?'请选择套餐':'预付 '+money(tarif.offers[offer][1])+' 并充电')+'</button></section>';
}
function service(k,text,ic){return '<button class="tool" data-service="'+k+'">'+icon(ic)+text+chevron+'</button>';}
function meView(){return '<div class="accountHead"><div class="avatar">'+icon('user')+'</div><div><h1>我的</h1><small>充电用户 · 模拟账户</small></div></div><section class="wallet"><div class="spread"><strong>我的钱包</strong><button data-service="wallet">查看钱包 ›</button></div><small>可用余额</small><div class="balance">¥ 28.00</div></section><div class="spread heading"><h2>充电订单</h2><button class="link" data-service="orders">全部订单 ›</button></div><button class="orderRow" data-service="orders"><strong>'+(order?order.station+' · '+order.port+' 号端口':'北苑车棚充电站 · 03 号端口')+'</strong><small>'+(order?'已支付，设备启动确认中':'已完成 · 已结算 ¥2.00')+'</small></button><section class="area"><h2>账户服务</h2><div class="services">'+service('card','在线卡','card')+service('bill','我的账单','bill')+'</div></section>';}
function key(s,d){return s+'/'+d;}
function clearSelection(s,d,port=null){selection={key:key(s,d),port,mode:'amount',offer:null};}
function draw(){
 route=readRoute();const {page,s,d}=route;const inner=['station','device'].includes(page);
 if(page==='device'&&selection.key!==key(s,d))clearSelection(s,d);
 el('main').classList.toggle('inner',inner);el('brand').hidden=inner;
 el('back').style.display=inner?'flex':'none';
 el('back').textContent=page==='device'?'‹  '+stations[s].name:'‹  首页';
 for(const [id,active] of [['homeNav',page!=='me'],['meNav',page==='me']]){
  if(active)el(id).setAttribute('aria-current','page');else el(id).removeAttribute('aria-current');
 }
 el('main').innerHTML=page==='home'?homeView():page==='station'?stationView(stations[s]):page==='device'?deviceView(stations[s],stations[s].devices[d]):meView();
}
function modal(title,body){el('modalTitle').textContent=title;el('modalBody').innerHTML=body;if(!el('sheet').open)el('sheet').showModal();}
el('close').onclick=()=>el('sheet').close();
el('homeNav').onclick=()=>nav('home');el('meNav').onclick=()=>nav('me');el('back').onclick=()=>route.page==='device'?nav('station',route.s):nav('home');
el('scanNav').onclick=()=>{modal('扫码充电','<p>H5 可输入设备编号或插座码，也可模拟小程序扫码。</p><form id="codeForm"><input aria-label="设备编号或插座码" id="code" placeholder="设备编号或插座码" required><p class="error" id="error" role="status"></p><button class="primary full">识别编号</button></form><button class="link full" id="simulate">模拟扫到北门 06 号端口</button>');
 function resolve(code){for(const [s,station] of stations.entries()){for(const [d,unit] of station.devices.entries()){
  const match=code.match(/^([0-9]+)(?:-(\d{1,2}))?$/);if(!match||match[1]!==unit[1])continue;
  const port=match[2]===undefined?null:Number(match[2])-1;if(port!==null&&(port<0||port>=unit[2].length)){break;}
  clearSelection(s,d,port!==null&&unit[2][port]==='i'?port:null);el('sheet').close();nav('device',s,d);return;
 }}el('error').textContent='未识别此编号，可核对设备号，或使用下方模拟扫码。';}
 el('codeForm').onsubmit=e=>{e.preventDefault();resolve(el('code').value.trim());};el('simulate').onclick=()=>resolve('5348240514082652-06');
};
function account(k){
 const current=order?'<p>'+order.station+' · '+order.port+' 号端口 · 已预付 '+money(order.price)+'</p><p>设备启动确认中</p>':'';
 const data={orders:['充电订单',current+'<p>北苑车棚充电站 · 03 号端口</p><p>已完成 · 实收 ¥2.00 · 已结算</p>'],wallet:['我的钱包','<p>可用余额 ¥28.00，冻结金额 ¥0.00。</p><p>最近流水：模拟充值 +¥30.00，消费 −¥2.00。</p>'],card:['在线卡','<p>当前账户尚未绑定在线卡。</p>'],bill:['我的账单','<p>北苑车棚充电站 · 已结算 ¥2.00。</p>']};modal(...data[k]);
}
el('main').addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;const a=b.dataset;
 if('station'in a){nav('station',+a.station);return;}if('device'in a){clearSelection(route.s,+a.device);nav('device',route.s,+a.device);return;}
 if('service'in a){account(a.service);return;}
 if('port'in a){selection.port=+a.port;selection.offer=null;}else if('mode'in a){selection.mode=a.mode;selection.offer=null;}else if('offer'in a){selection.offer=+a.offer;}
 else if('pay'in a){
   if(order){account('orders');return;}
   const s=stations[route.s],d=s.devices[route.d],n=String(selection.port+1).padStart(2,'0'),p=modes[selection.mode].offers[selection.offer][1];
   modal('核对本次充电','<p>'+s.name+' · '+d[0]+' · '+n+' 号端口</p><p>预付 '+money(p)+'</p><button id="confirm" class="primary full">模拟支付并启动</button>');
   el('confirm').onclick=()=>{order={station:s.name,port:n,price:p};el('sheet').close();nav('me');};return;
 }else{return;}
 draw();const field=Object.keys(a)[0];const target=el('main').querySelector('[data-'+field+'="'+a[field]+'"]');if(target)target.focus({preventScroll:true});
});
window.addEventListener('hashchange',()=>{draw();window.scrollTo(0,0);});draw();
</script></body></html>
